# Curated parent -> listed-subsidiary map for Sum-of-the-Parts (SOTP) valuation.
#
# SEMANTICS (read before editing):
#   These are PARENT-COMPANY holdings, NOT promoter-group holdings. A listed
#   company under common family/trust control (a "sister") is NOT a subsidiary.
#   e.g. ADANIPORTS / ADANIPOWER / ADANIGREEN are held by the Adani family
#   trusts at the GROUP level, NOT by Adani Enterprises (AEL) -> they must never
#   be listed under ADANIENT. Only entities the company ITSELF holds belong here.
#
# This file is the single source of truth for listed-SOTP. It replaced a
# promoter-surname matching heuristic that mislabelled siblings as subsidiaries.
# The universe that needs listed-SOTP is small and stable, so a hand-curated,
# auditable list beats fragile PDF/AOC-1 extraction or surname matching.
#
# Stakes are flagged approximate via verify_note -> the agent confirms against the
# latest shareholding filing and fetches live market cap. Keep `as_of` current.
#
# Schema per symbol:
#   <PARENT_NSE_SYMBOL>:
#     note: "<optional> guidance shown when there are no listed holdings"
#     subsidiaries:
#       - sub_symbol: <NSE symbol of the listed holding>
#         sub_name: "<display name>"
#         parent_ownership_pct: <float>
#         relationship: "<short description>"
#         as_of: "YYYY-MM"

ADANIENT:
  note: >-
    Adani Enterprises is the Adani group INCUBATOR. Its material businesses
    (Airports, Roads, ANIL / green hydrogen, Kutch Copper, Data Centres) are
    UNLISTED. The listed Adani entities (Ports, Power, Green, Energy Solutions,
    Total Gas) are promoter-group SIBLINGS held by the family trusts, NOT by
    AEL — do NOT value them as AEL stakes. Build SOTP from AEL's own segment
    EBITDA x peer multiples, not group market cap.
  subsidiaries: []

